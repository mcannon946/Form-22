name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: >-
          ruff check
          scripts/form22_day_grid.py
          scripts/form22_earnings_fields.py
          scripts/form22_pipeline.py
          scripts/generate_form22.py
          scripts/payroll_importer.py
          scripts/payroll_parser.py
          scripts/pdf_population_engine.py
          tests/test_form22_pipeline.py
          --select E7,E9,F63,F7,F82

      - name: Test
        run: >-
          pytest tests
          --cov=form22_day_grid
          --cov=form22_earnings_fields
          --cov=form22_pipeline
          --cov=generate_form22
          --cov=payroll_importer
          --cov=payroll_parser
          --cov=pdf_population_engine
          --cov-report=term-missing
